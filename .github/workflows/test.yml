name: Playwright Tests

on:
  push:
    branches:
      - main
      - master
      - develop

  pull_request:
    branches:
      - main
      - master
      - develop

  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run Playwright Tests
    runs-on: self-hosted
    timeout-minutes: 60

    steps:
      - name: Environment check
        run: |
          whoami
          id
          docker --version
          docker ps

      - name: Prepare report directories
        run: |
          rm -rf playwright-report test-results
          mkdir -p playwright-report test-results

      - name: Build Docker image
        run: docker build -t playwright-training:${{ github.sha }} .

      - name: Run Playwright Tests in Docker
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/playwright-report:/app/playwright-report \
            -v ${{ github.workspace }}/test-results:/app/test-results \
            playwright-training:${{ github.sha }}
      - name: Fix report ownership
        if: always()
        run: |
          sudo chown -R $(id -un):$(id -gn) playwright-report test-results || true

      - name: Verify generated reports
        if: ${{ !cancelled() }}
        run: |
          echo "=== Playwright Report ==="
          ls -la playwright-report || true

          echo "=== Test Results ==="
          ls -la test-results || true

      - name: Upload Playwright HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_number }}
          path: playwright-report/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload test evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_number }}
          path: test-results/
          retention-days: 30
          if-no-files-found: warn

      - name: Remove current Docker image
        if: ${{ always() }}
        run: docker image rm playwright-training:${{ github.sha }} || true